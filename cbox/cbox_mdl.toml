[camera]
position = [0.0, 1.0, 6.8]
look_at = [0.0, 1.0, 0.0]
ref_up = [0.0, 1.0, 0.0]
fov = 19.5
focal_length = 1.0

[film]
resolution = [512, 512]
denoise = false
num_samples = 512

[integrator]
type = 'path'
max_depth = 64
rr_depth = 8
rr_prob = 0.1
shader_reorder = false

[[bsdf]]
type = 'mdl'
name = 'grey'
source = 'cbox_materials.mdl'
material = 'GreyMaterial'

[[bsdf]]
type = 'mdl'
name = 'green'
source = 'cbox_materials.mdl'
material = 'GreenMaterial'

[[bsdf]]
type = 'mdl'
name = 'red'
source = 'cbox_materials.mdl'
material = 'RedMaterial'

[[primitive]]
type = 'trimesh'
path = 'geometry/light.ply'
face_normals = true
light = { type = 'area', emission = [17.0, 12.0, 5.0] }

[[primitive]]
type = 'trimesh'
path = 'geometry/floor.ply'
face_normals = true
bsdf = 'grey'

[[primitive]]
type = 'trimesh'
path = 'geometry/left.ply'
face_normals = true
bsdf = 'red'

[[primitive]]
type = 'trimesh'
path = 'geometry/right.ply'
face_normals = true
bsdf = 'green'

[[primitive]]
type = 'trimesh'
path = 'geometry/ceiling.ply'
face_normals = true
bsdf = 'grey'

[[primitive]]
type = 'trimesh'
path = 'geometry/back.ply'
face_normals = true
bsdf = 'grey'

[[primitive]]
type = 'trimesh'
path = 'geometry/boxes.ply'
face_normals = true
bsdf = 'grey'
