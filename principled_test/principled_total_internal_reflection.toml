# Camera starts inside the transmissive sphere and looks tangentially enough
# to exceed the critical angle for eta = 1.5, producing total internal
# reflection on the center ray.

[camera]
position = [0.0, 0.0, 0.75]
look_at  = [1.0, 0.0, 0.75]
ref_up   = [0.0, 1.0, 0.0]
fov      = 45

[film]
resolution  = [768, 768]
denoise     = false
num_samples = 1024

[integrator]
type      = 'path'
max_depth = 64
rr_depth  = 6
rr_prob   = 0.1

[sampler]
type = 'halton'

[envmap]
texture = { type = 'constant', color = [0.01, 0.012, 0.015] }

[[bsdf]]
name       = 'glass_tir'
type       = 'principled'
base_color = [1.0, 1.0, 1.0]
roughness  = 0.0
metallic   = 0.0
spec_trans = 1.0
eta        = 1.5

[[bsdf]]
name = 'marker_red'
type = 'diffuse'
R    = [0.82, 0.15, 0.15]

[[bsdf]]
name = 'marker_green'
type = 'diffuse'
R    = [0.18, 0.72, 0.20]

[[bsdf]]
name = 'marker_blue'
type = 'diffuse'
R    = [0.22, 0.36, 0.82]

[[bsdf]]
name = 'marker_grey'
type = 'diffuse'
R    = [0.32, 0.32, 0.34]

[[bsdf]]
name = 'emitter_black'
type = 'diffuse'
R    = [0.0, 0.0, 0.0]

[[primitive]]
type   = 'sphere'
center = [0.0, -100.85, 0.0]
radius = 100.0
bsdf   = 'marker_grey'

[[primitive]]
type   = 'sphere'
center = [0.0, 0.0, 0.0]
radius = 1.0
bsdf   = 'glass_tir'

[[primitive]]
type   = 'sphere'
center = [-1.35, -0.45, -3.25]
radius = 0.35
bsdf   = 'marker_red'

[[primitive]]
type   = 'sphere'
center = [0.0, 0.22, -3.80]
radius = 0.40
bsdf   = 'marker_green'

[[primitive]]
type   = 'sphere'
center = [1.25, -0.15, -3.05]
radius = 0.35
bsdf   = 'marker_blue'

[[primitive]]
type   = 'sphere'
center = [0.0, 1.55, -4.80]
radius = 0.55
bsdf   = 'emitter_black'
light  = { type = 'area', emission = [36.0, 31.0, 26.0] }

[[primitive]]
type   = 'sphere'
center = [2.20, 2.40, 1.80]
radius = 0.45
bsdf   = 'emitter_black'
light  = { type = 'area', emission = [8.0, 9.0, 12.0] }
