# Metallic Principled reference with specular = 0.0.
# The metallic lobe should still produce visible reflections.

[camera]
position = [0.0, 2.0, 7.0]
look_at  = [0.0, 1.0, 0.0]
ref_up   = [0.0, 1.0, 0.0]
fov      = 30

[film]
resolution  = [1024, 1024]
denoise     = false
num_samples = 1024

[integrator]
type      = 'path'
max_depth = 32
rr_depth  = 4
rr_prob   = 0.1

[sampler]
type = 'independent'

[envmap]
texture = { type = 'constant', color = [0.03, 0.035, 0.04] }

[[bsdf]]
name = 'ground'
type = 'diffuse'
R    = [0.35, 0.35, 0.36]

[[bsdf]]
name       = 'metallic_zero_specular'
type       = 'principled'
base_color = [0.96, 0.72, 0.28]
roughness  = 0.18
metallic   = 1.0
specular   = 0.0

[[bsdf]]
name = 'emitter_black'
type = 'diffuse'
R    = [0.0, 0.0, 0.0]

[[primitive]]
type   = 'sphere'
center = [0.0, -100.0, 0.0]
radius = 100.0
bsdf   = 'ground'

[[primitive]]
type   = 'sphere'
center = [0.0, 1.0, 0.0]
radius = 1.0
bsdf   = 'metallic_zero_specular'

[[primitive]]
type   = 'sphere'
center = [-2.2, 4.2, 3.4]
radius = 0.7
bsdf   = 'emitter_black'
light  = { type = 'area', emission = [26.0, 22.0, 18.0] }

[[primitive]]
type   = 'sphere'
center = [2.4, 3.8, 1.8]
radius = 0.7
bsdf   = 'emitter_black'
light  = { type = 'area', emission = [12.0, 15.0, 22.0] }
