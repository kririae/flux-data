# ShaderBall: default scene (no material variant override)

[scene]
type = "usd"
path = "./assets/standard_shader_ball_scene.usda"
camera = "/standard_shader_ball_scene/camera"

[film]
resolution = [1024, 1024]
num_samples = 256
denoise = true

[integrator]
type = "path"
max_depth = 16
rr_depth = 4
rr_prob = 0.1
shader_reorder = false
